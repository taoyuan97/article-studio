[project]
name = "article-agent-core"
version = "0.1.0"
description = "Article Studio backend: FastAPI service + LangGraph article agent core"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "langchain>=0.3.27,<0.4",
  "langchain-deepseek>=0.1.4,<0.2",
  "langchain-openai>=0.3.30,<0.4",
  "langgraph>=0.6.6,<0.7",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["article_agent", "app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
